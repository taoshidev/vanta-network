name: Python CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-timeout

      - name: Run unit tests
        # Per-test timeout (pytest.ini: timeout=300, timeout_method=signal) fails a
        # hung test and lets the suite continue, with an all-thread stack dump first.
        # This job-level backstop just guards against the harness itself wedging.
        timeout-minutes: 20
        run: |
          pytest tests/vali_tests/
