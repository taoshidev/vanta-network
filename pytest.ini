[pytest]
# ---------------------------------------------------------------------------
# Hang diagnostics for the RPC-heavy validator suite.
#
# The suite spawns RPC server processes and uses multiprocessing.Pool for the
# parallel perf-ledger path. A single deadlock (e.g. a pool worker dying while
# deserializing a task that embeds an unreachable RPC client) used to wedge the
# whole run until GitHub killed the job at the 60-minute wall clock, with no
# indication of which test was stuck.
#
# pytest-timeout bounds every test so a single hang can't run out the CI clock.
#
# timeout_method=signal: on timeout, raise in the test's main thread so ONLY that
# test fails and the suite continues ("fail fast and move on"). The alternative,
# thread, hard-kills the whole pytest process on the first hang, so the remaining
# tests never run.
#
# faulthandler_timeout fires ~10s earlier and dumps the stack of EVERY live thread
# to stderr, so a hang is still diagnosable (which RPC/daemon thread is stuck)
# before the per-test timeout fails it.
# ---------------------------------------------------------------------------
timeout = 300
timeout_method = signal
faulthandler_timeout = 290

# Collapse each failure/error to a single line instead of a full traceback, so a
# large number of failures doesn't bury the run in console output. Use --tb=no for
# no tracebacks at all, or --tb=short for a few lines of context per failure.
addopts = --tb=line
