[pytest]
# ---------------------------------------------------------------------------
# Hang diagnostics for the RPC-heavy validator suite.
#
# The suite spawns RPC server processes and uses multiprocessing.Pool for the
# parallel perf-ledger path. A single deadlock (e.g. a pool worker dying while
# deserializing a task that embeds an unreachable RPC client) used to wedge the
# whole run until GitHub killed the job at the 60-minute wall clock, with no
# indication of which test was stuck.
#
# Per-test hang handling is layered (no single test should take this long):
#   100s  faulthandler_timeout -- dump EVERY thread's stack to stderr (diagnostics)
#   110s  pytest-timeout (signal) -- fail just this test and continue, IF the hang
#         is interruptible from the main thread
#   120s  conftest watchdog thread -- SIGKILL the whole process group; the hard
#         backstop for C-level hangs (RPC socket recv, multiprocessing joins) that
#         signal cannot interrupt. See tests/vali_tests/conftest.py.
#
# signal (not thread) here because the watchdog is the real backstop; signal just
# gives interruptible hangs a chance to fail individually and let the suite go on.
# ---------------------------------------------------------------------------
timeout = 110
timeout_method = signal
faulthandler_timeout = 100

# Collapse each failure/error to a single line instead of a full traceback, so a
# large number of failures doesn't bury the run in console output. Use --tb=no for
# no tracebacks at all, or --tb=short for a few lines of context per failure.
addopts = --tb=line
